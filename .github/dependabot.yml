version: 2
updates:
  # talia-connector bundles a Node MCP server — the only dependency tree in this
  # marketplace. Everything else is plain skills with no third-party packages.
  - package-ecosystem: npm
    directory: /plugins/talia-connector/mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "fix(talia-connector)"
      include: scope
    # Most of these deps are transitive (qs, hono, fast-uri… pulled via the MCP
    # SDK's HTTP transport). Group non-major bumps into a single PR so routine
    # patch/minor security fixes don't spam the repo with one PR each.
    groups:
      talia-mcp-deps:
        update-types:
          - minor
          - patch
